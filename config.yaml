# local-agent configuration
# Modify these defaults as needed.

index:
  # Sentence-aware chunking (respects . ! ? boundaries)
  sentence_chunking: true
  # Optimization: parallel extraction workers (0 = disabled)
  extraction_workers: 4
  # Optimization: accumulate chunks before embedding (reduces model calls)
  embed_accumulate_batch: 2048
  # default path(s) to index when running automated tasks or recursive index
  paths:
    - "~/Documents"
    - "~/Desktop"
    - "~/Downloads"
    - "~/Pictures"
  chunk_size: 500
  max_tokens: 1200
  overlap: 80
  embed_batch: 2048
  upsert_batch: 8000
  max_items: 1000
  allow_exts: [".txt", ".md", ".markdown", ".pdf", ".docx", ".html", ".htm", ".rtf"]
  ocr_enabled: false
  # OCR only for non-text files (images). Never runs on PDFs/text docs.
  ocr_only_for_images: true
  # When set, only index images under these paths (e.g. Pictures, Screenshots).
  # Empty = index all images when ocr_enabled. Speeds up indexing by skipping images elsewhere.
  ocr_paths: []  # e.g. ["Pictures", "Screenshots"]
  # OCR backend: tesseract (default) | paddleocr | easyocr
  ocr_backend: tesseract
  max_pdf_pages: 50
  extraction_timeout: 10
  # Exclude patterns for system-wide scans
  exclude_patterns:
    - "**/node_modules/**"
    - "**/.git/**"
    - "**/__pycache__/**"
    - "**/.venv/**"
    - "**/venv/**"
    - "**/Library/**"
    - "**/System/**"
    - "**/Applications/**"
    - "**/usr/**"
    - "**/var/**"
    - "**/tmp/**"
    - "**/.cache/**"
    - "**/.Trash/**"
    - "**/.*/**"

# Daemon mode (python3 local-agent/cli.py daemon --startup-index --idle-updates)
daemon:
  idle_interval_minutes: 30  # Minutes between full re-index cycles
  max_items_per_slice: 1000 # Items per BFS slice during indexing

search:
  top_k: 50
  lex_k: 100
  vec_k: 150
  merge_k: 200
  timeout_sec: 2.5
  cache_size: 256  # Search result cache (higher = better for repeated queries)
  # Hard limit: abort search if exceeds (seconds). 20 = max for heavy queries.
  max_search_sec: 20
  # Run vector and lexical search in parallel (faster)
  parallel_search: true
  # Merge strategy: weighted (default) or rrf (Reciprocal Rank Fusion, often more accurate)
  merge_strategy: weighted
  rrf_k: 60  # RRF constant when merge_strategy=rrf
  # Query expansion adds latency; disable for faster search
  expand_query: false
  bm25_weight: 0.55
  cosine_weight: 0.45
  exact_boost: 0.20
  early_pos_boost: 0.10
  snippet_radius: 50
  # Hide low-relevance results (browser links use stricter threshold)
  min_score_threshold: 0.08
  min_score_browser: 0.12

qdrant:
  url: "http://localhost:6333"
  prefer_grpc: true
  collection: "local_agent_vectors"
  dim: 384
  hnsw_config:
    m: 32
    ef_construct: 256
  optimizers_config:
    default_segment_number: 4

paths:
  store: "store"
  catalog: "store/catalog.db"
  frontier: "store/frontier.json"
  cache: "store/cache"

embedding:
  model: "sentence-transformers/all-MiniLM-L6-v2"
  dim: 384
  # Normalize embeddings for better cosine similarity (recommended)
  normalize_embeddings: true
  # Use ONNX backend for 2-3x faster inference (pip install sentence-transformers[onnx])
  use_onnx: false

vectordb:
  use_qdrant: true
  collection_name: "local_agent_vectors"
  storage_path: "local-agent/store/vectors"

llm:
  use_ollama: true
  # Use smaller model for faster AI labels (phi2, qwen2:0.5b, or llama3.2:3b)
  model: "llama3.2:3b"
  timeout_seconds: 15

logging:
  runs_path: "local-agent/store/runs"

# Browser indexing (bookmarks + history)
browser:
  enabled: true
  enabled_browsers: ["chrome", "firefox"]
  max_bookmarks: 10000
  max_history: 5000
